[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "topic-file-finder"
version = "0.1.0"
description = "주제별 공개 자료(논문·보고서·공공데이터) 검색·다운로드 앱"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "typer>=0.12",
  "rich>=13",
  "pydantic>=2.5",
  "pyyaml>=6",
  "python-dotenv>=1.0",
  "ddgs>=9",
  "streamlit>=1.35",
  "pandas>=2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "respx>=0.21"]
llm = ["anthropic>=0.40"]

[project.scripts]
finder = "topic_finder.cli:app"

[tool.setuptools.packages.find]
include = ["topic_finder*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
